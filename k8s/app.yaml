apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: web
          image: ${USER}/image-queue-python:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://app:postgres@postgres:5432/appdb"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: LEASE_SECONDS
              value: "30"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: worker
          image: ${USER}/image-queue-python:${TAG}
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker"]
          env:
            - name: DATABASE_URL
              value: "postgresql://app:postgres@postgres:5432/appdb"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: LEASE_SECONDS
              value: "30"
