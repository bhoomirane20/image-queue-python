apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: qa
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: image-queue-python:qa
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/imgq"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: LEASE_SECONDS
              value: "30"