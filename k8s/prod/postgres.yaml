apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: prod
data:
  001_schema.sql: |
    CREATE TABLE IF NOT EXISTS jobs (
        id           BIGSERIAL PRIMARY KEY,
        state        TEXT NOT NULL DEFAULT 'queued'
                     CHECK (state IN ('queued','processing','done','failed','dead')),
        attempts     INT NOT NULL DEFAULT 0 CHECK (attempts >= 0),
        filename     TEXT NOT NULL DEFAULT 'upload.bin',
        content_type TEXT NOT NULL DEFAULT '',
        src_bytes    INT NOT NULL DEFAULT 0,
        src_data     BYTEA,
        src_width    INT,
        src_height   INT,
        box_width    INT NOT NULL DEFAULT 320,
        box_height   INT NOT NULL DEFAULT 320,
        out_width    INT,
        out_height   INT,
        out_data     BYTEA,
        last_error   TEXT,
        leased_at    TIMESTAMPTZ,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS jobs_state ON jobs (state, id DESC);
    CREATE INDEX IF NOT EXISTS jobs_leased ON jobs (leased_at) WHERE state = 'processing';
  002_seed.sql: |
    INSERT INTO jobs (id, state, attempts, filename, content_type, src_bytes,
                      src_width, src_height, box_width, box_height,
                      out_width, out_height, last_error, created_at, updated_at) VALUES
     (1,'done',1,'graduation-group.jpg','image/jpeg',2411008,4000,3000,320,320,320,240,NULL,
         now() - interval '3 hours', now() - interval '3 hours' + interval '4 seconds'),
     (2,'done',1,'campus-gate.png','image/png',880640,1600,1200,640,640,640,480,NULL,
         now() - interval '2 hours', now() - interval '2 hours' + interval '2 seconds'),
     (3,'done',2,'lab-panorama.jpg','image/jpeg',5242880,8000,1000,320,320,320,40,NULL,
         now() - interval '90 minutes', now() - interval '90 minutes' + interval '11 seconds'),
     (4,'dead',3,'not-really-an-image.pdf','application/pdf',12044,NULL,NULL,320,320,NULL,NULL,
         'UnidentifiedImageError: cannot identify image file',
         now() - interval '40 minutes', now() - interval '38 minutes'),
     (5,'dead',3,'truncated-upload.png','image/png',311,NULL,NULL,200,200,NULL,NULL,
         'OSError: image file is truncated',
         now() - interval '20 minutes', now() - interval '18 minutes')
    ON CONFLICT DO NOTHING;
    SELECT setval('jobs_id_seq', (SELECT max(id) FROM jobs));
    UPDATE jobs SET out_data = decode('','base64') WHERE id=1 AND out_data IS NULL;
    UPDATE jobs SET out_data = decode('','base64') WHERE id=2 AND out_data IS NULL;
    UPDATE jobs SET out_data = decode('iVBORw0KGgoAAAANSUhEUgAAAUAAAAAoCAIAAAAAIrR+AAAAcklEQVR42u3TQQkAAAgEwctpCOOY1xJ+hIFJsLCpaeCpSAAGBgwMGBgMDBgYMDBgYDAwYGDAwGBgwMCAgQEDg4EBAwMGBgwMBgYMDBgYDAwYGDAwYGAwMGBgwMCAgcHAgIEBA4OBAQMDBgYMDAYGDAxcWKf0X/02NTU8AAAAAElFTkSuQmCC','base64')  WHERE id=3 AND out_data IS NULL;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: prod
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "imgq"
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "imgq"]
            initialDelaySeconds: 5
            periodSeconds: 2
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: prod
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
